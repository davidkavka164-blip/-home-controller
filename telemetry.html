<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOME CLOUD REV04</title><style>body{font:16px system-ui;max-width:600px;margin:auto;padding:20px;background:#eef3f6;color:#12334a}label,input,button{display:block;margin:8px 0}input{box-sizing:border-box;width:100%;padding:10px}button{padding:12px}section{background:white;padding:16px;border-radius:12px;margin:12px 0}</style><h1>HOME CLOUD REV04</h1><p>Test pouze pro čtení. Bez ovládání.</p><form id="f"><label>WSS adresa<input id="url" required placeholder="wss://broker.example/mqtt"></label><label>Uživatel pouze pro čtení<input id="user" required></label><label>Heslo<input id="pass" type="password" required></label><label>Topic<input id="topic" value="home-test/esp1/telemetry" required></label><button>Připojit</button></form><button id="stop">Odpojit</button><section><p id="state">Odpojeno</p><p id="data">Žádná data</p></section><a href="./">Zpět na demo</a><script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.4/dist/mqtt.min.js"></script><script>
const $=id=>document.getElementById(id);let client=null,last=0,connected=false;
function reset(){if(client){const old=client;client=null;old.end(true);}connected=false;last=0;$('data').textContent='Žádná aktuální data';$('state').textContent='Odpojeno';}
$('stop').onclick=reset;
$('f').onsubmit=e=>{e.preventDefault();reset();let u;try{u=new URL($('url').value);if(u.protocol!=='wss:'||u.username||u.password)throw Error();}catch{ $('state').textContent='Použij platnou WSS adresu';return;}const topic=$('topic').value.trim();if(!topic||/[+#]/.test(topic)){ $('state').textContent='Zadej přesný topic';return;}if(!window.mqtt){$('state').textContent='MQTT knihovna nedostupná';return;}const c=client=mqtt.connect(u.href,{username:$('user').value,password:$('pass').value,clean:true,reconnectPeriod:5000,connectTimeout:10000});$('pass').value='';$('state').textContent='Připojování';c.on('connect',()=>{if(client!==c)return;c.subscribe(topic,{qos:0},err=>{if(client!==c)return;connected=!err;$('state').textContent=err?'Odběr selhal':'Čekám na data';});});c.on('close',()=>{if(client!==c)return;connected=false;last=0;$('state').textContent='Spojení přerušeno';$('data').textContent='Žádná aktuální data';});c.on('error',()=>{if(client===c)$('state').textContent='Chyba spojení';});c.on('message',(t,b,p)=>{if(client!==c||t!==topic||p.retain||b.length>2048)return;try{const d=JSON.parse(b.toString());if(d.schema!==1||d.simulated!==true||!Number.isFinite(d.levelCm)||d.levelCm<0||d.levelCm>800||typeof d.pump!=='boolean'||!Number.isFinite(d.timestamp)||Math.abs(Date.now()/1000-d.timestamp)>30)return;last=Date.now();$('data').textContent='SIMULACE | Hladina: '+d.levelCm+' cm | Čerpadlo: '+(d.pump?'zapnuto':'vypnuto')+' | '+new Date(d.timestamp*1000).toLocaleTimeString('cs-CZ');}catch{}});};
setInterval(()=>{if(connected){const fresh=last&&Date.now()-last<30000;$('state').textContent=fresh?'Připojeno – aktuální simulace':last?'Data zastaralá':'Čekám na data';if(!fresh)$('data').textContent='Žádná aktuální data';}},1000);
</script></html>
