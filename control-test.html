<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOME CONTROL REV07</title><style>body{font:17px system-ui;max-width:600px;margin:24px auto;padding:16px}input,button{font:inherit;padding:10px;margin:5px 0}input{width:90%}button{margin-right:8px}#state{padding:16px;background:#eee}</style><h1>HOME CONTROL REV07</h1><p>Pouze virtuální výstup, žádné GPIO.</p><input id="pw" type="password" placeholder="Heslo home-app" autocomplete="off"><button id="connect">Připojit</button><button id="disconnect">Odpojit</button><p id="state">Odpojeno</p><button id="on" disabled>ON</button><button id="off" disabled>OFF</button><p id="result"></p><script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.4/dist/mqtt.min.js"></script><script>
const $=id=>document.getElementById(id);
let client=null, latest=null, received=0,pending=null,ready=false;
function refresh(){const valid=ready&&client&&client.connected&&latest&&Date.now()-received<30000; $('on').disabled=$('off').disabled=!valid||!!pending;$('state').textContent=valid?'ESP32 potvrzuje: '+(latest.output?'ON':'OFF')+' | '+new Date(latest.timestamp*1000).toLocaleTimeString():'Čeká na aktuální stav / odpojeno';if(pending&&Date.now()>pending.until){pending=null;$('result').textContent='Bez potvrzení – výsledek neznámý';}}
function reset(){ready=false;latest=null;received=0;if(pending)$('result').textContent='Spojení přerušeno – výsledek neznámý';pending=null;refresh();}
$('connect').onclick=()=>{if(client)client.end(true);reset();const password=$('pw').value;if(!password)return;const c=mqtt.connect('wss://broker.mqtty.com:8884/mqtt',{username:'home-app',password,clientId:'home-control-test-browser',clean:true,reconnectPeriod:3000});client=c;$('pw').value='';c.on('connect',()=>{if(client!==c)return;reset();c.subscribe('home-test/esp1/control',{qos:0},(err,grants)=>{if(client!==c)return;ready=!err&&grants&&grants.length===1&&grants[0].qos===0;refresh();});});c.on('close',()=>{if(client===c)reset();});c.on('error',()=>{if(client===c)reset();});c.on('message',(topic,buf,packet)=>{if(client!==c||!ready||packet.retain||topic!=='home-test/esp1/control')return;try{const s=JSON.parse(buf.toString());if(s.schema!==1||s.simulated!==true||!/^[0-9a-f]{32}$/.test(s.session)||!Number.isInteger(s.id)||s.id<0||s.id>4294967295||typeof s.output!=='boolean'||!Number.isInteger(s.timestamp)||Math.abs(Date.now()/1000-s.timestamp)>30)return;if(latest&&latest.session===s.session&&s.id<latest.id)return;latest=s;received=Date.now();if(pending&&s.session!==pending.session){pending=null;$('result').textContent='Nová relace – výsledek neznámý';}else if(pending&&s.id===pending.id&&s.output===pending.output){pending=null;$('result').textContent='Provedení potvrzeno ESP32';}refresh();}catch(e){}});};
$('disconnect').onclick=()=>{const c=client;client=null;if(c)c.end(true);reset();};
function send(output){refresh();if($('on').disabled)return;const id=latest.id+1;if(id>4294967295)return;const expiry=Math.floor(Date.now()/1000)+10;pending={session:latest.session,id,output,until:Date.now()+15000};$('result').textContent='Čeká na potvrzení ESP32';client.publish('home-app/esp1/command',latest.session+' '+id+' '+expiry+' '+(output?'ON':'OFF'),{qos:0,retain:false});refresh();}
$('on').onclick=()=>send(true);$('off').onclick=()=>send(false);setInterval(refresh,500);
</script></html>
